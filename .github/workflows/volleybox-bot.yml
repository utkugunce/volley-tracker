name: Volleybox Auto Entry Bot

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Hedef İl Slug (veya tümü için all)'
        required: false
        default: 'all'
      limit:
        description: 'Eklenecek maksimum maç sayısı'
        required: false
        default: '25'
      delay:
        description: 'Maçlar arası bekleme süresi (saniye)'
        required: false
        default: '8'
      dry_run:
        description: 'Önizleme modu (form gönderilmez)'
        type: boolean
        required: false
        default: false

concurrency:
  group: volleybox-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Cache Playwright Chromium Browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Install Playwright Chromium (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium

      - name: Run Volleybox Bot
        env:
          VOLLEYBOX_USERNAME: ${{ secrets.VOLLEYBOX_USERNAME }}
          VOLLEYBOX_PASSWORD: ${{ secrets.VOLLEYBOX_PASSWORD }}
          VOLLEYBOX_COOKIE: ${{ secrets.VOLLEYBOX_COOKIE }}
        run: |
          ARGS=""
          if [ "${{ inputs.city }}" != "all" ] && [ -n "${{ inputs.city }}" ]; then
            ARGS="$ARGS --city ${{ inputs.city }}"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.delay }}" ]; then
            ARGS="$ARGS --delay ${{ inputs.delay }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          ARGS="$ARGS --headless"
          echo "Running: python scripts/push_volleybox_matches.py $ARGS"
          python scripts/push_volleybox_matches.py $ARGS

      - name: Commit and push updated match links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Herhangi bir veri değişikliği olmadı."
          else
            git commit -m "chore(volleybox): sync matches added by automated bot [skip ci]"
            git push
          fi
