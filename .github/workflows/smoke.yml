name: Production Smoke Test

on:
  deployment_status: {}
  workflow_dispatch:
    inputs:
      base_url:
        description: "Test edilecek adres"
        default: "https://altyapivoleybol.com.tr"
        required: false
        type: string

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Smoke Test
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url || 'https://altyapivoleybol.com.tr' }}
        run: node scripts/smoke.mjs

      - name: Create smoke failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Canlı Smoke Testi Başarısız Oldu"
          BODY=$(cat <<EOF
          Canlı ortam smoke testi başarısız oldu (P0/P1 regresyon tespit edildi).

          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Hedef Adres: ${{ inputs.base_url || github.event.deployment_status.target_url || 'https://altyapivoleybol.com.tr' }}
          - Tarih: $(date -u +'%Y-%m-%d %H:%M UTC')

          Lütfen smoke test günlüklerini inceleyin (HTTP 404, HTTP 200, Başlık marka eki, CSS veya Bundle ihlalleri).
          EOF
          )
          EXISTING=$(gh issue list --state open --label bug \
            --search "Canlı Smoke Testi Başarısız Oldu in:title" --json number,title \
            --jq '[.[] | select(.title | contains("Canlı Smoke Testi Başarısız Oldu"))][0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Açık issue #$EXISTING zaten var; yeni issue açılmıyor, yorum ekleniyor."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug
          fi
