name: Import approved data into Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/cities/**'
      - 'data/fixtures.json'

permissions:
  contents: read

concurrency:
  group: supabase-approved-data-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check authoritative roles migration (008)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check_supabase_roles.mjs --sync-missing
      - name: Import reviewed main snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run supabase:import
