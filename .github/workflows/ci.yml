name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: CI validation
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r scripts/requirements.txt pytest==9.0.2

      - name: Python tests
        run: python -m pytest tests -q

      - name: Validate generated data files
        run: python scripts/validate_data_files.py

      - name: Check data freshness
        run: |
          if [[ "${{ github.ref_name }}" == automation/tvf-data-* || "${{ github.head_ref }}" == automation/tvf-data-* ]]; then
            python scripts/check_data_freshness.py
          else
            python scripts/check_data_freshness.py || echo "::warning::data/cities.json 24 saatten eski (kod PR doğrulaması devam ediyor)"
          fi

      # data/cities.json değiştiyse src/utils/citySlugs.ts (edge 404 allowlist'i)
      # yeniden üretilmek zorunda; aksi halde geçersiz il adresleri 200 döner (soft 404).
      - name: Check generated city allowlist is up to date
        run: python scripts/generate_city_slugs.py --check

      - name: Run lint
        run: npm run lint

      # next.config.mjs'te typescript.ignoreBuildErrors: true olduğu için tip hatası
      # ne Vercel'de ne de build adımında yakalanır. Bu adım tek güvenlik ağı.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "Build successful - .next directory exists"
            ls -la .next | head -20
          else
            echo "Build failed - .next directory not found"
            exit 1
          fi

      - name: Check installed browser
        run: google-chrome --version

      - name: Production browser checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm start > /tmp/volley-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          python -m pytest tests/e2e/visual_smoke.py -q

      - name: Browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: /tmp/volley-e2e
