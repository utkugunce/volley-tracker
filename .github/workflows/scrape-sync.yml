name: TVF Scraper Sync

on:
  schedule:
    # Saatte bir (dakika 7: saat başı GitHub Actions yoğunluğundan kaçınmak için)
    - cron: '7 * * * *'
  workflow_dispatch:

# Üst üste binen çalışmalar aynı anda commit/push yapmasın
concurrency:
  group: scrape-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 curl_cffi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run TVF 81 provinces scraper
        run: |
          python scripts/scrape_all_provinces.py

      - name: Run TVF Kadinlar 2. Lig scraper
        run: |
          python scripts/scrape_kadinlar_2_lig.py

      - name: Sync Volleybox matches & scores
        run: |
          python scripts/sync_volleybox_matches.py

      - name: Check standings team name conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_standings_conflicts.py

      - name: Validate generated data files
        run: |
          python scripts/validate_data_files.py

      - name: Check data freshness
        run: |
          python scripts/check_data_freshness.py

      - name: Import synchronized data into Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run supabase:import

      # Yalnızca zaman damgası (updated_at vb.) değişen dosyaları geri al: içerik aynıysa commit'e girmez.
      # İçerik değişmediyse bile freshness kontrolüne tabi cities.json ve kadinlar_2_lig.json en fazla 12 saatte bir tazelenir.
      # Bu adım yalnızca optimizasyondur; başarısız olursa dosyalar eskisi gibi commit'lenir.
      - name: Skip timestamp-only data changes
        continue-on-error: true
        run: |
          python scripts/skip_timestamp_only_changes.py --heartbeat-hours 12

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Her data commit'i bir Vercel deploy'u = yeni ve boş ISR önbelleği demektir (ISR Write kotası).
          # Zamanlanmış çalışmalar iki data commit'i arasında en az bu kadar saat bekler; bekleyen değişiklikler
          # kaybolmaz (her çalışma yeniden tarar ve repodaki veriyle karşılaştırır), bir sonraki uygun çalışmada
          # commit'lenir. Supabase importu her çalışmada yapıldığı için API'ler güncel kalır.
          # Elle/yönetici tetiklemesi (workflow_dispatch) bu sınırı atlar. Repo değişkeniyle değiştirilebilir; 0 = kapalı.
          DATA_COMMIT_MIN_INTERVAL_HOURS: ${{ vars.DATA_COMMIT_MIN_INTERVAL_HOURS || '3' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Yalnızca data/ içeriği gerçekten değiştiyse commit at (izlenen dosyada değişiklik veya yeni dosya).
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard -- data/)" ]; then
            echo 'No data changes to commit'
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${DATA_COMMIT_MIN_INTERVAL_HOURS}" -gt 0 ] 2>/dev/null; then
            LAST_DATA_COMMIT=$(gh api "repos/${{ github.repository }}/commits?path=data&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$LAST_DATA_COMMIT" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_DATA_COMMIT" +%s) ))
              if [ "$AGE" -lt $(( DATA_COMMIT_MIN_INTERVAL_HOURS * 3600 )) ]; then
                echo "Son data commit'i $(( AGE / 60 )) dk önce ($LAST_DATA_COMMIT); ${DATA_COMMIT_MIN_INTERVAL_HOURS} saat dolmadan yeni deploy tetiklenmiyor. Değişiklikler sonraki çalışmada commit'lenecek."
                exit 0
              fi
            fi
          fi
          git add data/
          if git diff --staged --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m 'chore(data): periyodik TVF fikstur senkronizasyonu [skip ci]'
            git push
          fi

      - name: Create sync failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ TVF sync failed $(date -u +'%Y-%m-%d %H:%M UTC')"
          BODY=$(cat <<EOF
          Otomatik TVF senkronizasyonu başarısız oldu.

          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Tarih: $(date -u +'%Y-%m-%d %H:%M UTC')

          Lütfen ilgili logları inceleyin ve scrape/validation adımlarını doğrulayın.
          EOF
          )
          # Önceden açık bir sync-hata issue'su varsa yenisini açma, yorum ekle (spam önleme).
          # Başlıkta tarih olduğu için sabit kısımla ("TVF sync failed") aranır.
          EXISTING=$(gh issue list --state open --label automation \
            --search "TVF sync failed in:title" --json number,title \
            --jq '[.[] | select(.title | contains("TVF sync failed"))][0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Açık issue #$EXISTING zaten var; yeni issue açılmıyor, yorum ekleniyor."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            # Hata yutulmaz: issue açılamazsa adım başarısız olur ve günlükte görünür.
            gh issue create --title "$TITLE" --body "$BODY" --label automation
          fi
