name: TVF Scraper Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 curl_cffi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run TVF 81 provinces scraper
        run: |
          python scripts/scrape_all_provinces.py

      - name: Run TVF Kadinlar 2. Lig scraper
        run: |
          python scripts/scrape_kadinlar_2_lig.py

      - name: Sync Volleybox matches & scores
        run: |
          python scripts/sync_volleybox_matches.py

      - name: Check standings team name conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_standings_conflicts.py

      - name: Import synchronized data into Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run supabase:import

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m 'chore(data): periyodik TVF fikstur senkronizasyonu [skip ci]'
            git push
          fi
