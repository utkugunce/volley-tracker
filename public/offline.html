<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Çevrimdışı | Altyapı Voleybol</title>
  <style>
    :root { color-scheme: dark; --bg:#07131f; --panel:#0e2033; --line:#1b3550; --ink:#eaf6fa; --ink2:#a9c3d1; --accent:#2dd4c0; --accent-fg:#032320; }
    html[data-theme="light"] { color-scheme: light; --bg:#f4f8fb; --panel:#ffffff; --line:#cbd8e3; --ink:#0b1b2b; --ink2:#3e566b; --accent:#0d9488; --accent-fg:#ffffff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width:420px; width:100%; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px 24px; }
    h1 { font-size:1.35rem; margin:16px 0 8px; }
    p { margin:0 0 20px; line-height:1.55; color:var(--ink2); font-size:.95rem; }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    a, button { font:inherit; font-weight:700; font-size:.9rem; padding:10px 18px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--ink); text-decoration:none; cursor:pointer; }
    .primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
    svg { width:56px; height:56px; color:var(--accent); }
  </style>
</head>
<body>
  <main role="main">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg>
    <h1 id="t">Çevrimdışısınız</h1>
    <p id="b">İnternet bağlantısı yok. Daha önce açtığınız sayfalar ve son kaydedilen fikstür verileri kullanılabilir olabilir.</p>
    <div class="actions">
      <button class="primary" id="r" type="button">Tekrar dene</button>
      <a id="h" href="/">Ana sayfaya dön</a>
    </div>
  </main>
  <script>
    (function () {
      try {
        var d = document.documentElement, p = localStorage.getItem("av-theme");
        var light = p === "light" || (p !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        d.setAttribute("data-theme", light ? "light" : "dark");
        if (localStorage.getItem("av-lang") === "en") {
          d.lang = "en";
          document.title = "Offline | Altyapı Voleybol";
          document.getElementById("t").textContent = "You are offline";
          document.getElementById("b").textContent = "No internet connection. Pages you opened earlier and the last saved fixture data may still be available.";
          document.getElementById("r").textContent = "Try again";
          document.getElementById("h").textContent = "Back to home";
        }
      } catch (e) {}
      document.getElementById("r").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    })();
  </script>
</body>
</html>
